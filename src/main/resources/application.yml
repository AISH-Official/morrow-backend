spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: morrow-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/morrow;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  error:
    include-message: always
openai:
  api:
    key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o}
  enabled: ${OPENAI_ENABLED:false}
morrow:
  demo:
    seed: ${MORROW_DEMO_SEED:true}
