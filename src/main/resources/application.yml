spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: morrow-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/morrow;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  error:
    include-message: always
openai:
  api:
    key: ${OPENAI_API_KEY:}
  chat-model: ${OPENAI_CHAT_MODEL:gpt-5.6-sol}
  short-model: ${OPENAI_SHORT_MODEL:gpt-5.6-terra}
  fallback-model: ${OPENAI_FALLBACK_MODEL:gpt-5.6-luna}
  enabled: ${OPENAI_ENABLED:false}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: app.morrow.api
  paths-to-match: /api/v1/**
morrow:
  time-zone: ${MORROW_TIME_ZONE:Asia/Seoul}
  assistant:
    time-zone: ${MORROW_TIME_ZONE:Asia/Seoul}
    include-health-data: ${MORROW_AI_INCLUDE_HEALTH_DATA:false}
  auth:
    required: ${MORROW_AUTH_REQUIRED:false}
  push:
    check-in-reminders-enabled: ${MORROW_CHECK_IN_REMINDERS_ENABLED:true}
    check-in-cron: "${MORROW_CHECK_IN_CRON:0 0 * * * *}"
    ai-evaluation-min-load: ${MORROW_AI_EVALUATION_MIN_LOAD:20}
    apns:
      enabled: ${APNS_ENABLED:false}
      team-id: ${APNS_TEAM_ID:}
      key-id: ${APNS_KEY_ID:}
      private-key: ${APNS_PRIVATE_KEY:}
      private-key-path: ${APNS_PRIVATE_KEY_PATH:}
      ios-topic: ${APNS_IOS_TOPIC:com.qlsl1198.morrowwellness}
      watch-topic: ${APNS_WATCH_TOPIC:com.qlsl1198.morrowwellness.watchkitapp}
  demo:
    seed: ${MORROW_DEMO_SEED:true}
  demo-login:
    enabled: ${MORROW_DEMO_LOGIN_ENABLED:false}
    username: ${MORROW_DEMO_LOGIN_USERNAME:}
    password: ${MORROW_DEMO_LOGIN_PASSWORD:}
    user-id: ${MORROW_DEMO_LOGIN_USER_ID:hackathon-demo}
