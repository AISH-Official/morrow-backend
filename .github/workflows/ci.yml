name: Backend CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  test:
    name: Maven test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode test

  deploy:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build executable jar
        run: mvn --batch-mode -DskipTests package
      - name: Configure deployment SSH key
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync OpenAI runtime secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_ENABLED: ${{ secrets.OPENAI_ENABLED }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$OPENAI_MODEL"
          case "$OPENAI_ENABLED" in
            true|false) ;;
            *) echo "OPENAI_ENABLED must be true or false" >&2; exit 1 ;;
          esac

          {
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_MODEL=%s\n' "$OPENAI_MODEL"
            printf 'OPENAI_ENABLED=%s\n' "$OPENAI_ENABLED"
          } | ssh ec2-user@"$EC2_HOST" \
            'sudo tee /etc/morrow-openai.env >/dev/null && sudo chmod 600 /etc/morrow-openai.env'

          ssh ec2-user@"$EC2_HOST" \
            'sudo mkdir -p /etc/systemd/system/morrow-api.service.d && printf "%s\n" "[Service]" "EnvironmentFile=-/etc/morrow-openai.env" | sudo tee /etc/systemd/system/morrow-api.service.d/openai.conf >/dev/null && sudo systemctl daemon-reload'
      - name: Upload release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          artifact="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)"
          test -n "$artifact"
          ssh ec2-user@"$EC2_HOST" 'mkdir -p /home/ec2-user/morrow-backend/releases'
          scp "$artifact" ec2-user@"$EC2_HOST":"/home/ec2-user/morrow-backend/releases/${GITHUB_SHA}.jar"
      - name: Activate release and verify health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh ec2-user@"$EC2_HOST" "GITHUB_SHA=${GITHUB_SHA} bash -s" <<'REMOTE'
          set -Eeuo pipefail
          app_dir=/home/ec2-user/morrow-backend
          release="$app_dir/releases/$GITHUB_SHA.jar"
          current="$app_dir/current.jar"
          previous="$(readlink -f "$current" || true)"

          test -s "$release"
          ln -sfn "$release" "$current"
          sudo systemctl restart morrow-api

          healthy=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            sudo journalctl -u morrow-api -n 80 --no-pager
            if [ -n "$previous" ] && [ -s "$previous" ]; then
              ln -sfn "$previous" "$current"
              sudo systemctl restart morrow-api
            fi
            exit 1
          fi

          ls -1t "$app_dir"/releases/*.jar | tail -n +6 | xargs -r rm --
          REMOTE
